[project]
name = "talent_finder"
version = "0.1.0"
description = "talent_finder using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.100.1,<1.0.0"
]

[project.scripts]
talent_finder = "talent_finder.main:run"
run_crew = "talent_finder.main:run"
train = "talent_finder.main:train"
replay = "talent_finder.main:replay"
test = "talent_finder.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
