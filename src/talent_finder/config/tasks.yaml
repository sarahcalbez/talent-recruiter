research_task:
  description: >
    Search GitHub Profiles about {topic} on the URL https://github.com/search?q=&type=users 
    search for the {topic} and location
    Access all profiles and get all relevant information about the profile
    1- name
    2- url 
    3- programming languages used by the profile.
    The current time is {date}
  expected_output: >
    A list of GitHub profiles about {topic} with the profiler name, url and programming languages used by the profile.
  agent: researcher

reporting_task:
  description: >
    Review the context you got.
    Make sure the report is detailed and contains any and all relevant information.
  expected_output: >
    A fully fledged reporting of the GitHub Profiles.
    Formatted as markdown without '```'
  agent: reporting_analyst
